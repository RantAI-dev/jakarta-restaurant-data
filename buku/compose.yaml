# Stack self-host web buku — dijalankan sebagai Portainer Git stack.
#
# Tidak ada database: seluruh isi buku sudah statis di dalam image (hasil impor
# naskah yang ikut ter-commit). Jadi stack ini cuma satu service.
#
# Port host 13035 dipilih agar tidak bentrok dengan platform (13031) maupun
# lakehouse (13030 & 13032).
# Untuk akses dari internet, tambahkan public hostname baru pada Cloudflare
# Tunnel yang sudah berjalan di server ini, arahkan ke http://localhost:13035
# (lihat DEPLOY.md) — tidak perlu tunnel kedua.
services:
  buku-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buku-app
    environment:
      NODE_ENV: production
    ports:
      - "13035:3000"
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

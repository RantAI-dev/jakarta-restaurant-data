<rect x="612" y="268" width="540" height="50" rx="4" fill="#f7ede2" stroke="#b5651d" stroke-width="1.2"/>
<text x="628" y="299" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">Vandalisme dan kontribusi keliru</text>
<rect x="48" y="330" width="540" height="50" rx="4" fill="#f7ede2" stroke="#b5651d" stroke-width="1.2"/>
<text x="64" y="361" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">Cakupan tidak merata antar-wilayah</text>
<rect x="612" y="330" width="540" height="50" rx="4" fill="#f7ede2" stroke="#b5651d" stroke-width="1.2"/>
<text x="628" y="361" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">Akurasi lokasi dan status yang cepat basi</text>
<text x="48" y="416" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Crowdsourcing menambal apa yang tidak tercatat agregat resmi — atraksi kecil, status real-time, event lokal — tetapi hanya</text>
<text x="48" y="436" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">berguna bila melewati verifikasi sebelum dipublikasikan. Sumber: naskah subbab 9.3, diolah.</text>

<text x="540" y="116" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1a2b42" text-anchor="start">Moderasi komunitas</text>
<text x="540" y="146" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#1a1a1a" text-anchor="start">Aturan platform, tinjauan</text>
<text x="540" y="162.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#1a1a1a" text-anchor="start">kontributor lain</text>

<text x="1016" y="146" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#1a1a1a" text-anchor="start">Masuk portal data daerah</text>
<text x="1016" y="162.2" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="400" fill="#1a1a1a" text-anchor="start">sebagai data pelengkap</text>
<text x="48" y="248" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b5651d" text-anchor="start">Empat masalah kualitas yang harus ditangani di tahap moderasi dan verifikasi</text>

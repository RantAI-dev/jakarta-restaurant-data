<text x="348" y="348" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#1a1a1a" text-anchor="start">Walidata yang ditetapkan · standar metadata · interoperabilitas lewat API — berlaku di seluruh lapisan, bukan hanya di ujung</text>
<text x="48" y="400" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Data lake menyimpan sinyal dalam bentuk mentahnya, lalu mengurasinya bertahap. Tanpa tata kelola di baris bawah, ia berhenti</text>

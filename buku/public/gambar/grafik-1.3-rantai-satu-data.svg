<rect x="326" y="90" width="236" height="92" rx="4" fill="#1a2b42" stroke="#1a2b42" stroke-width="1.4"/>
<text x="444" y="141" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Walidata (BPS, Kemenpar)</text>
<line x1="568" y1="136" x2="596" y2="136" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ujung)"/>
<rect x="604" y="90" width="236" height="92" rx="4" fill="#eef4f9" stroke="#4a6fa5" stroke-width="1.4"/>
<text x="722" y="141" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1a2b42" text-anchor="middle">Portal Satu Data Indonesia</text>
<line x1="846" y1="136" x2="874" y2="136" stroke="#6b7280" stroke-width="1.6" marker-end="url(#ujung)"/>
<rect x="882" y="90" width="236" height="92" rx="4" fill="#eef4f9" stroke="#4a6fa5" stroke-width="1.4"/>
<text x="1000" y="132.25" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1a2b42" text-anchor="middle">Pengguna (kota, peneliti,</text>
<text x="1000" y="149.75" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#1a2b42" text-anchor="middle">publik)</text>
<text x="48" y="228" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1a2b42" text-anchor="start">Tiga prasyarat Perpres 39/2019</text>
<rect x="48" y="244" width="276" height="52" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="64" y="275" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Standar metadata</text>
<rect x="348" y="244" width="276" height="52" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="364" y="275" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Walidata yang ditetapkan</text>
<rect x="648" y="244" width="276" height="52" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.2"/>
<text x="664" y="275" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#1a1a1a" text-anchor="start">Interoperabilitas lewat API</text>
<text x="48" y="336" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#b5651d" text-anchor="start">Titik yang masih putus</text>
<rect x="48" y="352" width="348" height="62" rx="4" fill="#f7ede2" stroke="#b5651d" stroke-width="1.3"/>
<text x="64" y="378" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">Metadata untuk sumber big data belum ada</text>
<text x="64" y="395.55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">standarnya</text>
<rect x="420" y="352" width="348" height="62" rx="4" fill="#f7ede2" stroke="#b5651d" stroke-width="1.3"/>
<text x="436" y="378" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">Rilis masih bulanan atau tahunan, bukan</text>
<text x="436" y="395.55" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">real-time</text>
<rect x="792" y="352" width="348" height="62" rx="4" fill="#f7ede2" stroke="#b5651d" stroke-width="1.3"/>
<text x="808" y="378" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">Kapasitas tim data di tingkat kota timpang</text>
<text x="48" y="444" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Kebijakan data terpadu menetapkan siapa bertanggung jawab atas data apa, sehingga angka dari kota yang berbeda bisa</text>
<text x="48" y="464" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">dibandingkan. Rantainya sudah lengkap di atas kertas; yang belum selesai ada di baris bawah. Sumber: Perpres No. 39 Tahun 2019</text>
<text x="48" y="484" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">dan naskah subbab 1.4, diolah.</text>
</svg>

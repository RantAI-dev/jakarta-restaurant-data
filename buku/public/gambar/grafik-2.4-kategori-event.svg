<text x="70" y="530" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#1a1a1a" text-anchor="start">MUSIK, HIBURAN MUSIK, PERTUNJUKAN MUSIK, PERTUNJUKAN MUSIK / DJ, dan seterusnya — bersama-sama mencakup 528 event, 66 persen dari seluruh katalog</text>
<text x="48" y="582" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">Kolomnya ada, terisi, dan tetap tidak bisa dijumlahkan. Selama nilainya ditulis bebas tanpa daftar kode baku, penggabungan</text>
<text x="48" y="602" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">antar-instansi akan selalu berhenti di tahap ini. Sumber: katalog event Dinas Pariwisata semester I 2026, dihitung apa adanya</text>
<text x="48" y="622" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" font-style="italic">tanpa pembersihan.</text>
